<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real vs Fake Voice Detector</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <h1>🎙️ Real vs Fake Voice Detector</h1>
    <p class="sub">Record your voice, or upload a clip, to check if it's REAL or AI-generated FAKE speech.</p>

    <div class="controls">
      <button id="recordBtn" class="btn record">● Start Recording</button>
      <span id="timer" class="timer"></span>
      <label class="btn upload">
        Upload File
        <input type="file" id="fileInput" accept="audio/*" hidden>
      </label>
    </div>

    <div id="status" class="status"></div>

    <div id="board" class="board idle">
      <div id="boardLabel" class="board-label">—</div>
      <div id="boardConfidence" class="board-confidence"></div>
      <div id="boardBreakdown" class="board-breakdown"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
